name: SkyView CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-validation:
    name: FastAPI Backend & Multi-Tier AI Mesh Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r infra/requirements.txt

      - name: Validate All 18 FastAPI Route Modules
        run: |
          python -c "from skyview.main import app; print('SUCCESS: Registered', len(app.routes), 'routes')"

      - name: Validate Multi-Tier Model Consensus Mesh
        run: |
          python -c "from skyview.utils.llm_pool import pool_status; print(pool_status())"

      - name: Validate System-One Decision Router
        run: |
          python -c "from skyview.agents.decision_router import evaluate_intent; res = evaluate_intent('wheat rust disease'); print('Decision:', res.category, '| Confidence:', res.confidence)"

  frontend-build:
    name: React 18 + Vite Production Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Packages
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Run Production Vite Build & Typecheck
        working-directory: frontend
        run: npm run build
