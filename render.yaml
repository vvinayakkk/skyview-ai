services:
  - type: web
    name: brics-agrin-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r infra/requirements.txt"
    startCommand: "uvicorn skyview.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
